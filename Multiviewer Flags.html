<head>
  <title>Multiviewer Flags</title>
  <meta description="F1 Multiviewer Flag Display" />
  <meta publisher="mrbiscuit921" />

  <meta
    property="flashing"
    label="Flashing Enabled"
    type="boolean"
    default="0" />
  <meta
    property="sc_colour"
    label="Safety Car Colour"
    type="color"
    default="#ffa500"
    min="0"
    max="360" />
  <meta
    property="speed"
    label="Flashing Speed"
    type="number"
    min="1"
    max="10"
    default="1" />
  <meta
    property="default_colour"
    label="Default Colour"
    type="color"
    default="#000000"
    min="0"
    max="360" />
</head>

<body style="margin: 0; padding: 0">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var c = document.getElementById("exCanvas");
  var ctx = c.getContext("2d");
  var width = 320;
  var height = 200;
  var frames = 0;

  var activeFlagEvent = "";
  var activeSectorEvent = [];

  // Only these events are allowed to change the flag colour
  var FLAG_EVENTS = [
    "allClear",
    "sectorClear",
    "yellowFlag",
    "safetyCarDeployed",
    "virtualSafetyCarDeployed",
    "virtualSafetyCarEnding",
    "redFlag",
  ];

  function onCanvasApiEvent(data) {
    if (
      !data ||
      data.sender != "F1_Multiviewer" ||
      typeof data.event != "string"
    )
      return;

    if (data.event.indexOf("sector_") === 0) {
      activeSectorEvent = data.event.slice(7).split("_");
    } else if (FLAG_EVENTS.indexOf(data.event) !== -1) {
      activeFlagEvent = data.event;
    }
  }

  function update() {
    frames++;

    // FLAGS
    if (activeFlagEvent == "allClear" || activeFlagEvent == "sectorClear") {
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(0, 0, width, height);
    } else if (activeFlagEvent == "yellowFlag") {
      ctx.fillStyle = "#ffff00";
      ctx.fillRect(0, 0, width, height);
    } else if (
      activeFlagEvent == "safetyCarDeployed" ||
      activeFlagEvent == "virtualSafetyCarDeployed" ||
      activeFlagEvent == "virtualSafetyCarEnding"
    ) {
      if (flashing) {
        if ((frames * speed) % 50 < 25) {
          ctx.fillStyle = "#ffff00";
          ctx.fillRect(0, 0, width, height);
        } else {
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, width, height);
        }
      } else {
        ctx.fillStyle = sc_colour;
        ctx.fillRect(0, 0, width, height);
      }
    } else if (activeFlagEvent == "redFlag") {
      ctx.fillStyle = "#ff0000";
      ctx.fillRect(0, 0, width, height);
    } else {
      ctx.fillStyle = default_colour;
      ctx.fillRect(0, 0, width, height);
    }

    // SECTORS
    for (let i = 0; i < 3; i++) {
      if (activeSectorEvent[i] == "Fastest") {
        ctx.fillStyle = "#A020F0";
        ctx.fillRect(0 + i * (width / 3), 160, width / 3, height / 5);
      } else if (activeSectorEvent[i] == "Personal") {
        ctx.fillStyle = "#00E600";
        ctx.fillRect(0 + i * (width / 3), 160, width / 3, height / 5);
      } else if (activeSectorEvent[i] == "None") {
        ctx.fillStyle = "#FFD700";
        ctx.fillRect(0 + i * (width / 3), 160, width / 3, height / 5);
      }
    }

    window.requestAnimationFrame(update);
  }

  window.addEventListener("message", (e) => {
    var parsedData = typeof e.data === "string" ? JSON.parse(e.data) : e.data;

    if (parsedData) {
      onCanvasApiEvent(parsedData.value || parsedData);
    }
  });

  window.requestAnimationFrame(update);
</script>
